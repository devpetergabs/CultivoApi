spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/cultivo_inteligente?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Ensure the DB session uses utf8mb4 end-to-end, avoiding '?' replacement for accents.
spring.datasource.hikari.connectionInitSql=SET NAMES utf8mb4 COLLATE utf8mb4_0900_ai_ci

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.encoding=UTF-8

api.security.token.secret=${API_SECURITY_TOKEN_SECRET:123456789}

server.error.include-message=never
server.servlet.context-path=/api
openweather.apikey=ef627a6c8715b0461637f0f010160d61
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.ai.ollama.text-model=${OLLAMA_TEXT_MODEL:llama3.2:latest}
app.ai.doctor-plant.prompt-file=${AI_DOCTOR_PLANT_PROMPT_FILE:docs/ai/doctor-plant/referencial/prompt/doctor-prompt.md}
app.ai.doctor-plant.sources-dir=${AI_DOCTOR_PLANT_SOURCES_DIR:docs/ai/doctor-plant/referencial/fontes}

# DevTools: reinicia automaticamente quando arquivos em docs/ mudam (ex: doctor-prompt.md)
spring.devtools.restart.additional-paths=docs

# Por padrão o seed do banco é controlado via Flyway.
# Se quiser recriar usuários/entidades via Java (apenas DEV), ative com:
# app.data-initializer.enabled=true
app.data-initializer.enabled=false