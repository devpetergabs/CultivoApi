services:
  mysql:
    image: mysql:8.1
    container_name: cultivo_inteligente_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cultivo_inteligente
    ports: # Expondo a porta 3307 do container para a porta 3306 do host
      - "3307:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci

volumes:
  mysql_data:
