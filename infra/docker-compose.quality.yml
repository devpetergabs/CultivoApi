services:
  sonarqube-db:
    image: postgres:16
    container_name: cultivo-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONARQUBE_DB_USER:-sonarqube} -d ${SONARQUBE_DB_NAME:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - quality

  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION:-2025.1.1-community}
    container_name: cultivo-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: ${SONARQUBE_JDBC_URL:-jdbc:postgresql://sonarqube-db:5432/sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_JDBC_USERNAME:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_JDBC_PASSWORD:-sonarqube}
      SONAR_WEB_CONTEXT: ${SONARQUBE_CONTEXT_PATH:-/}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:9000"
    networks:
      - quality

networks:
  quality:
    name: cultivo-quality

volumes:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
