services:
  devlake-db:
    image: mysql:8
    container_name: cultivo-devlake-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${DEVLAKE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DEVLAKE_DB_NAME}
      MYSQL_USER: ${DEVLAKE_DB_USER}
      MYSQL_PASSWORD: ${DEVLAKE_DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${DEVLAKE_DB_PORT}:3306"
    volumes:
      - devlake-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DEVLAKE_DB_USER} -p${DEVLAKE_DB_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - cultivo-observability

  grafana:
    image: devlake.docker.scarf.sh/apache/devlake-dashboard:${DEVLAKE_VERSION}
    container_name: cultivo-grafana
    restart: unless-stopped
    depends_on:
      devlake-db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_DEFAULT_THEME: dark
      MYSQL_URL: devlake-db:3306
      MYSQL_DATABASE: ${DEVLAKE_DB_NAME}
      MYSQL_USER: ${DEVLAKE_DB_USER}
      MYSQL_PASSWORD: ${DEVLAKE_DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - cultivo-observability

  devlake:
    image: devlake.docker.scarf.sh/apache/devlake:${DEVLAKE_VERSION}
    container_name: cultivo-devlake
    restart: unless-stopped
    depends_on:
      devlake-db:
        condition: service_healthy
    env_file:
      - .env.observability
    environment:
      DB_URL: ${DEVLAKE_DB_URL}
      ENCRYPTION_SECRET: ${DEVLAKE_ENCRYPTION_SECRET}
      LOGGING_DIR: /app/logs
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${DEVLAKE_API_PORT}:8080"
    volumes:
      - devlake-log:/app/logs
    networks:
      - cultivo-observability

  config-ui:
    image: devlake.docker.scarf.sh/apache/devlake-config-ui:${DEVLAKE_VERSION}
    container_name: cultivo-devlake-config-ui
    restart: unless-stopped
    depends_on:
      - devlake
      - grafana
    env_file:
      - .env.observability
    environment:
      DEVLAKE_ENDPOINT: http://devlake:8080
      GRAFANA_ENDPOINT: http://grafana:3000
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${DEVLAKE_CONFIG_UI_PORT}:4000"
    networks:
      - cultivo-observability

networks:
  cultivo-observability:
    name: cultivo-observability

volumes:
  devlake-db-data:
  grafana-data:
  devlake-log:
